<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    

    <!-- Gradient for Globe Wireframe (Catppuccin Sapphire/Sky) -->
    <linearGradient id="globeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c7ec" />
      <stop offset="100%" stop-color="#89dceb" />
    </linearGradient>

    <!-- Gradient for URL Bar (Catppuccin Surface0/1) -->
    <linearGradient id="searchBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="100%" stop-color="#45475a" />
    </linearGradient>

    
  </defs>
  <!-- Center + scale the glyph to fill the canvas (background removed) -->
  <g transform="translate(256,256) scale(1.172) translate(-285.5,-242.5)">



  

  

  

  <!-- URL / Address Bar -->
  <rect x="180" y="60" width="260" height="32" rx="16" fill="url(#searchBarBg)" stroke="#45475a" stroke-width="2" />
  <!-- Lock Icon in URL Bar -->
  <path d="M 200 74 A 5 5 0 0 1 210 74 L 210 77 L 200 77 Z" fill="none" stroke="#a6e3a1" stroke-width="2" />
  <rect x="198" y="77" width="14" height="10" rx="2" fill="#a6e3a1" />

  <!-- Browser Globe Iconography -->
  <!-- Outer Globe Circle -->
  <circle cx="256" cy="300" r="120" fill="none" stroke="url(#globeGlow)" stroke-width="12" />

  <!-- Equator Line -->
  <line x1="136" y1="300" x2="376" y2="300" stroke="url(#globeGlow)" stroke-width="10" stroke-linecap="round" />

  <!-- Elliptical Latitudes -->
  <ellipse cx="256" cy="300" rx="60" ry="120" fill="none" stroke="url(#globeGlow)" stroke-width="10" />
  <ellipse cx="256" cy="300" rx="120" ry="50" fill="none" stroke="url(#globeGlow)" stroke-width="8" stroke-dasharray="8,8" opacity="0.6" />

  <!-- North/South Axis Line -->
  <line x1="256" y1="180" x2="256" y2="420" stroke="url(#globeGlow)" stroke-width="10" stroke-linecap="round" />

  </g>
</svg>
