<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    

    <!-- Accent Glow for Main Operations (Catppuccin Mauve/Pink) -->
    <linearGradient id="calcGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#f5c2e7" />
    </linearGradient>

    <!-- Glowing Accent for Display & Equals (Catppuccin Teal/Green) -->
    <linearGradient id="displayGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>

    
  </defs>
  <!-- Center + scale the glyph to fill the canvas (background removed) -->
  <g transform="translate(256,256) scale(1.361) translate(-256,-292.5)">



  

  

  

  <!-- Calculator Screen Frame -->
  <rect x="100" y="155" width="312" height="70" rx="16" fill="#181825" stroke="#313244" stroke-width="4" />
  <!-- Display Text / Segment Simulation -->
  <line x1="330" y1="190" x2="380" y2="190" stroke="url(#displayGlow)" stroke-width="12" stroke-linecap="round" />
  <circle cx="300" cy="190" r="6" fill="#45475a" />

  <!-- Keypad Grid (2x2 Math Operator Layout) -->
  <!-- Plus (+) -->
  <line x1="160" y1="270" x2="160" y2="330" stroke="url(#calcGlow)" stroke-width="20" stroke-linecap="round" />
  <line x1="130" y1="300" x2="190" y2="300" stroke="url(#calcGlow)" stroke-width="20" stroke-linecap="round" />

  <!-- Minus (-) -->
  <line x1="320" y1="300" x2="380" y2="300" stroke="url(#calcGlow)" stroke-width="20" stroke-linecap="round" />

  <!-- Multiply (×) -->
  <path d="M 138 378 L 182 422 M 182 378 L 138 422" stroke="url(#calcGlow)" stroke-width="20" stroke-linecap="round" />

  <!-- Equals (=) -->
  <line x1="320" y1="385" x2="380" y2="385" stroke="url(#displayGlow)" stroke-width="20" stroke-linecap="round" />
  <line x1="320" y1="415" x2="380" y2="415" stroke="url(#displayGlow)" stroke-width="20" stroke-linecap="round" />

  </g>
</svg>
