<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    

    <!-- Gradient for Main Photo Frame (Catppuccin Lavender/Mauve) -->
    <linearGradient id="frameGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4befe" />
      <stop offset="100%" stop-color="#cba6f7" />
    </linearGradient>

    <!-- Gradient for Sun/Moon Element (Catppuccin Peach/Yellow) -->
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af" />
      <stop offset="100%" stop-color="#fab387" />
    </linearGradient>

    <!-- Gradient for Mountains (Catppuccin Teal/Green) -->
    <linearGradient id="mountainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>

    
  </defs>
  <!-- Center + scale the glyph to fill the canvas (background removed) -->
  <g transform="translate(256,256) scale(1.433) translate(-256,-283)">



  

  

  

  <!-- Background Photo Stack (Layer behind) -->
  <rect x="152" y="160" width="240" height="200" rx="16" fill="#313244" transform="rotate(8 272 260)" opacity="0.6" />

  <!-- Main Photo Frame -->
  <rect x="112" y="180" width="288" height="220" rx="20" fill="none" stroke="url(#frameGlow)" stroke-width="12" />

  <!-- Sun Element inside photo -->
  <circle cx="180" cy="245" r="22" fill="url(#sunGlow)" />

  <!-- Mountain Peaks inside photo -->
  <!-- Back Mountain -->
  <path d="M 230 380 L 310 270 L 390 380 Z" fill="#89b4fa" opacity="0.7" />
  <!-- Front Mountain -->
  <path d="M 120 380 L 220 230 L 320 380 Z" fill="url(#mountainGlow)" />

  </g>
</svg>
